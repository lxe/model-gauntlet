<text class="t" x="24" y="38">Hard calls (grayzone): every model lands at 53–64%, and every interval overlaps Opus’s</text>
<text class="s" x="24" y="62">Pass rate on 120 Ethereum transfers, 60 phishing and 60 not, thinking low; bars are 95% Wilson intervals. Right: $ per 1,000 calls over the whole suite.</text>
